# Runs the tests on Windows, against every supported major version of PostgreSQL, installed on the runner (see
# tests-native.yml). This is a separate workflow from the Linux tests, with its own badge in the README.
name: Windows tests

on:
    push:
        branches:
            - main
            # Also run on the 5.x branch, where 5.0 is developed and then merged into main. Remove this line once
            # 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
        tags:
            - "*"
    pull_request:
        branches:
            - main
            # As above, remove this line once 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
    # Adds a "Run workflow" button on the Actions tab (only once this file is on the default branch).
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests on Windows
        uses: ./.github/workflows/tests-native.yml
        with:
            runs-on: windows-latest

# Lints every file and runs the tests on every supported version of PHP against every supported version of PostgreSQL,
# then runs PHPStan, using the same script as running them locally (testing/run-all-php-versions.sh), which runs each
# in its own throwaway Docker container. The README's "Tests" badge shows the result of the latest run on the branch it
# names.
name: Tests

on:
    # Pushes to the main branch (not work-in-progress branches), and every tag, e.g. a new release.
    push:
        branches:
            - main
            # Also run on the 5.x branch, where 5.0 is developed and then merged into main. Remove this line once
            # 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
        tags:
            - "*"
    # Pull requests into the main branch, so they are tested before being merged.
    pull_request:
        branches:
            - main
            # As above, remove this line once 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
    # Adds a "Run workflow" button on the Actions tab, to run the tests by hand on any branch.
    workflow_dispatch:

# The tests only need to read the code.
permissions:
    contents: read

jobs:
    tests:
        name: Lint and tests on PHP 8.2, 8.3, 8.4, 8.5 and 8.6, PostgreSQL 14 to 18
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out the code
              uses: actions/checkout@v5

            # The tests use vendor/autoload.php. The runner's own PHP is only used to run Composer. composer.json sets
            # the platform to PHP 8.2, so the dependencies it installs work on every supported version.
            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run lint and the tests on every supported version of PHP and PostgreSQL, then PHPStan
              shell: bash
              run: |
                  # GitHub runs bash with -e, which would stop here if the tests failed, so catch the exit code instead.
                  # pipefail (which GitHub also sets) makes it the tests' exit code, rather than tee's.
                  set -o pipefail
                  STATUS=0
                  bash testing/run-all-php-versions.sh 2>&1 | tee test-output.txt || STATUS=$?
                  bash testing/github-annotations.sh "Linux" test-output.txt "$STATUS"
                  exit $STATUS

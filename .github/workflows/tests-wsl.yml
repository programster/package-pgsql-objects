# Runs the tests in WSL 2 (the Windows Subsystem for Linux), with PHP and PostgreSQL both installed in WSL's Ubuntu.
# WSL 2 runs in its own lightweight virtual machine, with its own network, so it can't reach a PostgreSQL running on
# the Windows side at 127.0.0.1. This is a separate workflow from the Linux tests, with its own badge in the README.
name: WSL tests

on:
    push:
        branches:
            - main
            # Also run on the 5.x branch, where 5.0 is developed and then merged into main. Remove this line once
            # 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
        tags:
            - "*"
    pull_request:
        branches:
            - main
            # As above, remove this line once 5.0.0 has been released and 5.x is no longer used.
            - "5.x"
    # Adds a "Run workflow" button on the Actions tab (only once this file is on the default branch).
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests in WSL 2, PostgreSQL 16
        runs-on: windows-latest
        timeout-minutes: 40

        steps:
            - name: Check out the code
              uses: actions/checkout@v5

            # Ubuntu 24.04's own PHP is 8.3, and its own PostgreSQL is 16. Commands run in WSL as root.
            - name: Install WSL, with PHP and PostgreSQL
              uses: Vampire/setup-wsl@v7
              with:
                  distribution: Ubuntu-24.04
                  wsl-version: 2
                  additional-packages:
                      php8.3-cli
                      php8.3-pgsql
                      php8.3-mbstring
                      php8.3-xml
                      php8.3-zip
                      composer
                      unzip
                      postgresql

            # Copy the code into WSL's own filesystem (the checkout is on a Windows drive, at /mnt/...), so the tests
            # run where WSL's files really are. Environment variables set by GitHub don't reach WSL, so the connection
            # details are set here.
            - name: Run the tests in WSL
              shell: wsl-bash {0}
              run: |
                  echo "::notice title=WSL kernel::$(uname -r)"
                  service postgresql start
                  su postgres -c "psql -c \"CREATE ROLE test WITH LOGIN SUPERUSER PASSWORD 'test'\""
                  su postgres -c "createdb --owner=test pgsql_objects_test"

                  rm -rf /src
                  cp -r . /src
                  cd /src
                  composer install --no-interaction --no-progress --prefer-dist
                  export TEST_DB_HOST=127.0.0.1 TEST_DB_PORT=5432 TEST_DB_USER=test TEST_DB_PASSWORD=test
                  export TEST_DB_NAME=pgsql_objects_test

                  # Catch the exit code, so the annotations are still written if the tests fail. pipefail makes it the
                  # tests' exit code, rather than tee's.
                  set -o pipefail
                  status=0
                  php testing/main.php 2>&1 | tee test-output.txt || status=$?
                  bash testing/github-annotations.sh "WSL" test-output.txt "$status"
                  exit $status

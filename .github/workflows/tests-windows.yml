# Runs the tests on Windows, against every supported major version of PostgreSQL, installed on the runner (see
# tests-native.yml). This is a separate workflow from the Linux tests, with its own badge in the README.
name: Windows tests

on:
    push:
        branches:
            - main
            # TEMPORARY: also run on the 5.x branch, where version 5 is developed until it is released, so both the
            # main branch (4.x) and 5.x are tested. Remove this line once 5.x has been merged into the main branch.
            - "5.x"
        tags:
            - "*"
    pull_request:
        branches:
            - main
            # TEMPORARY: as above, remove this line once 5.x has been merged into the main branch.
            - "5.x"
    # Adds a "Run workflow" button on the Actions tab (only once this file is on the default branch).
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests on Windows
        uses: ./.github/workflows/tests-native.yml
        with:
            runs-on: windows-latest
